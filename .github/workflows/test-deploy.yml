name: Test deployment

on:
  pull_request:
    paths-ignore:
      - '**/README.md'
    types: [opened, edited, synchronize, reopened]

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18
      - name: Install Antora and dependencies
        run: make environment
      - name: Generate Site
        run: |
          # Allow antora to complete without halting the bash script on failure
          set +e
          npx antora --stacktrace \
            --log-file local-build.log \
            --log-format=pretty \
            --log-level=info \
            playbook-local.yml 2>&1 | tee local-build.log 2>&1
          set -e

          # Reset BUILD_STATUS to 0; fail ONLY if an English (en) error/warning exists
          BUILD_STATUS=0

          # Check local-build.log specifically for asciidoctor issues originating from /modules/en/
          if awk '
            /ERROR \(asciidoctor\)|WARN \(asciidoctor\)|INFO \(asciidoctor\)/ { flagged=1; msg=$0; next }
            flagged {
              if ($0 ~ /file:.*\/modules\/en\//) {
                print "Found issue in English docs:\n" msg "\n" $0;
                failed=1
              }
              flagged=0
            }
            END { exit failed ? 1 : 0 }
          ' local-build.log; then
            echo "✅ No English documentation issues detected."
          else
            echo "❌ Build failed due to errors/warnings in English modules."
            BUILD_STATUS=1
          fi

          echo "BUILD_STATUS=$BUILD_STATUS" >> $GITHUB_ENV
      - name: Check for build errors
        run: |
          echo ${{ env.BUILD_STATUS }}
          if [ ${{ env.BUILD_STATUS }} -eq "0" ]; then
            exit 0
          else
            cat local-build.log
            exit 1
          fi
