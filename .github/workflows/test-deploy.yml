name: Test deployment

on:
  pull_request:
    paths-ignore:
      - '**/README.md'
    types: [opened, edited, synchronize, reopened]

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 18
      - name: Install Antora and dependencies
        run: make environment
      - name: Generate Site
        run: |
          npx antora --stacktrace \
            --log-file local-build.log \
            --log-format=pretty \
            --log-level=info \
            --log-failure-level=warn \
            playbook-local.yml 2>&1 | tee local-build.log 2>&1
          
          BUILD_STATUS=${PIPESTATUS[0]}
          
          if grep -B1 '/modules/en/' local-build.log | grep -E -q "(ERROR|INFO) \(asciidoctor\)"; then
            echo "Found errors or infos in English modules."
            BUILD_STATUS=1
          fi
          
          echo "BUILD_STATUS=$BUILD_STATUS" >> $GITHUB_ENV
      - name: Check for build errors
        run: |
          echo ${{ env.BUILD_STATUS }}
          if [ ${{ env.BUILD_STATUS }} -eq "0" ]; then
            exit 0
          else
            cat local-build.log
            exit 1
          fi
